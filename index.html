<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Memo Analyzer</title>
  <style>
    :root {
      --bg-base: #121212;
      --bg-surface: #1e1e1e;
      --bg-surface-hover: #2a2a2a;
      --border-color: #333333;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 280px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .report-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .report-item {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.15s;
    }

    .report-item:hover, .report-item.active {
      background-color: var(--bg-surface-hover);
    }

    .report-title {
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .report-date {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Main Content */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    h3 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    /* Input Controls */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .input-box {
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    button {
      background-color: var(--bg-surface-hover);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    button:hover:not(:disabled) {
      background-color: #383838;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
    }

    button.primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    button.recording {
      background-color: var(--danger);
      border-color: var(--danger);
      color: white;
    }

    input[type="file"] {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Results Panel */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .transcript-box {
      background-color: var(--bg-base);
      padding: 16px;
      border-radius: 6px;
      line-height: 1.6;
      border: 1px solid var(--border-color);
      white-space: pre-wrap;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background-color: var(--bg-surface-hover);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .sentiment-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      background-color: var(--bg-surface-hover);
      border: 1px solid var(--border-color);
    }

    ul.action-items {
      padding-left: 20px;
      line-height: 1.6;
    }

    audio {
      width: 100%;
      margin-top: 8px;
      filter: invert(0.9) hue-rotate(180deg);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Side Panel: Previous Reports -->
  <!-- TODO this is a placeholder at the moment -->
  <aside>
    <div class="sidebar-header">
      <span>Previous Reports</span>
      <button id="refreshReportsBtn" title="Refresh list">↻</button>
    </div>
    <ul class="report-list" id="reportList">
      <li class="report-item"><span class="report-date">Loading reports...</span></li>
    </ul>
  </aside>

  <!-- Main Workspace -->
  <main>
    <!-- Input Section -->
    <section class="card">
      <h2>New Audio Memo</h2>
      <div class="input-grid">
        <!-- Browser Recorder -->
        <div class="input-box">
          <h3>1. Record Memo</h3>
          <div>
            <button id="recordBtn">● Start Recording</button>
            <button id="stopBtn" disabled>■ Stop</button>
          </div>
          <span class="status-text" id="recordStatus">Ready to record</span>
          <audio id="previewPlayer" class="hidden" controls></audio>
        </div>

        <!-- File Upload -->
        <div class="input-box">
          <h3>2. Or Upload File</h3>
          <input type="file" id="fileInput" accept=".wav,.mp3,audio/wav,audio/mpeg" />
          <span class="status-text" id="fileStatus">Accepted formats: .wav, .mp3</span>
        </div>
      </div>

      <button id="submitBtn" class="primary" disabled>Submit Audio for Analysis</button>
      <p class="status-text" id="submitStatus" style="margin-top: 10px; text-align: center;"></p>
    </section>

    <!-- Results Panel -->
    <section class="card hidden" id="resultsPanel">
      <h2>Analysis Results</h2>
      <div class="results-grid">
        
        <!-- TTS Summary Audio Player -->
        <div class="full-width">
          <h3>TTS Summary Audio</h3>
          <audio id="ttsPlayer" controls></audio>
        </div>

        <!-- Transcript -->
        <div class="full-width">
          <h3>Full Transcript</h3>
          <div class="transcript-box" id="transcriptText"></div>
        </div>

        <!-- Sentiment Score -->
        <div>
          <h3>Sentiment Score</h3>
          <div class="sentiment-badge" id="sentimentScore">—</div>
        </div>

        <!-- Key Phrases -->
        <div>
          <h3>Key Phrases</h3>
          <div class="tags-container" id="keyPhrasesContainer"></div>
        </div>

        <!-- Named Entities -->
        <div>
          <h3>Named Entities</h3>
          <table>
            <thead>
              <tr>
                <th>Entity</th>
                <th>Type</th>
              </tr>
            </thead>
            <tbody id="entitiesTableBody"></tbody>
          </table>
        </div>

        <!-- Action Items -->
        <div>
          <h3>Action Items</h3>
          <ul class="action-items" id="actionItemsList"></ul>
        </div>

      </div>
    </section>
  </main>

    <script>
    // State
    let mediaRecorder = null;
    let audioChunks = [];
    let selectedAudioBlob = null;
    let selectedFilename = 'recording.webm';

    // DOM Elements
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const recordStatus = document.getElementById('recordStatus');
    const previewPlayer = document.getElementById('previewPlayer');
    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    const submitBtn = document.getElementById('submitBtn');
    const submitStatus = document.getElementById('submitStatus');
    const resultsPanel = document.getElementById('resultsPanel');
    const reportList = document.getElementById('reportList');
    const refreshReportsBtn = document.getElementById('refreshReportsBtn');

    // --- 1. Audio Recording (MediaRecorder API) ---
    recordBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          selectedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          selectedFilename = `memo_${Date.now()}.webm`;

          // Clear file input if user recorded instead
          fileInput.value = '';
          fileStatus.textContent = 'Accepted formats: .wav, .mp3';

          // Show audio preview
          previewPlayer.src = URL.createObjectURL(selectedAudioBlob);
          previewPlayer.classList.remove('hidden');

          recordStatus.textContent = 'Recording ready to submit.';
          submitBtn.disabled = false;

          // Stop microphone tracks
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        recordBtn.disabled = true;
        recordBtn.classList.add('recording');
        recordBtn.textContent = '● Recording...';
        stopBtn.disabled = false;
        submitBtn.disabled = true;
        recordStatus.textContent = 'Recording in progress...';
      } catch (err) {
        recordStatus.textContent = 'Microphone access denied or unavailable.';
        console.error(err);
      }
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        recordBtn.disabled = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '● Start Recording';
        stopBtn.disabled = true;
      }
    });

    // --- 2. File Upload Handling ---
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      selectedAudioBlob = file;
      selectedFilename = file.name;

      // Reset recorder preview
      previewPlayer.classList.add('hidden');
      recordStatus.textContent = 'Ready to record';

      fileStatus.textContent = `Selected: ${file.name}`;
      submitBtn.disabled = false;
    });

    // --- 3. Submit to POST /process ---
    submitBtn.addEventListener('click', async () => {
      if (!selectedAudioBlob) return;

      submitBtn.disabled = true;
      submitStatus.textContent = 'Processing audio... Please wait.';

      const formData = new FormData();
      formData.append('audio', selectedAudioBlob);

      try {
        const response = await fetch('/process', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        const data = await response.json();
        renderResults(data);
        submitStatus.textContent = 'Analysis complete.';
        fetchReports(); // Refresh sidebar
      } catch (err) {
        console.error(err);
        submitStatus.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    // --- 4. Render Results & Fetch TTS Audio ---
    function renderResults(data) {
      resultsPanel.classList.remove('hidden');

      // Transcript
      //TODO update this to actually match the json response?
      document.getElementById('transcriptText').textContent = data.pipeline_step_1.transcript || 'No transcript available.';

      // Sentiment
      document.getElementById('sentimentScore').textContent =
        data.pipeline_step_2.sentiment.overall !== undefined ? data.pipeline_step_2.sentiment.overall : 'N/A';

      // Key Phrases
      const tagsContainer = document.getElementById('keyPhrasesContainer');
      tagsContainer.innerHTML = '';
      (data.pipeline_step_2.key_topics || []).forEach(phrase => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = phrase;
        tagsContainer.appendChild(span);
      });

      // Named Entities
      const tbody = document.getElementById('entitiesTableBody');
      tbody.innerHTML = '';
      (data.pipeline_step_2.named_entities || []).forEach(ent => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(ent.text || '')}</td>
          <td>${escapeHtml(ent.category || '')}</td>
        `;
        tbody.appendChild(tr);
      });

      // Action Items
      const actionList = document.getElementById('actionItemsList');
      actionList.innerHTML = '';
      (data.action_items || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item.task;
        actionList.appendChild(li);
      });

      // TTS Audio Player (GET /summary-audio)
      const ttsPlayer = document.getElementById('ttsPlayer');
      const queryParam = data.tts_summary ? `?text=${encodeURIComponent(data.tts_summary)}` : ``;
      ttsPlayer.src = `/summary-audio${queryParam}`;
    }

    // --- 5. Fetch & Select Previous Reports ---
    // TODO temporary implementation - the data structure may change as the database is implemented
    async function fetchReports() {
      try {
        const response = await fetch('/reports');
        if (!response.ok) throw new Error('Failed to load reports');
        const reports = await response.json();

        reportList.innerHTML = '';
        if (!reports.length) {
          reportList.innerHTML = '<li class="report-item"><span class="report-date">No previous reports</span></li>';
          return;
        }

        reports.forEach(report => {
          const li = document.createElement('li');
          li.className = 'report-item';
          li.innerHTML = `
            <div class="report-title">${escapeHtml(report.title || `Report #${report.id}`)}</div>
            <div class="report-date">${escapeHtml(report.created_at || '')}</div>
          `;
          li.addEventListener('click', () => {
            document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
            loadReportDetails(report);
          });
          reportList.appendChild(li);
        });
      } catch (err) {
        reportList.innerHTML = '<li class="report-item"><span class="report-date">Could not load reports</span></li>';
        console.error(err);
      }
    }

    // TODO also temporary 
    async function loadReportDetails(reportSummary) {
      if (reportSummary.transcript) {
        renderResults(reportSummary);
        return;
      }

      try {
        const res = await fetch(`/reports/${encodeURIComponent(reportSummary.id)}`);
        if (!res.ok) throw new Error('Failed to fetch report details');
        const fullReport = await res.json();
        renderResults(fullReport);
      } catch (err) {
        console.error(err);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    refreshReportsBtn.addEventListener('click', fetchReports);

    // Initial load
    fetchReports();
  </script>
